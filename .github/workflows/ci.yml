name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-functions:
    name: Edge Functions (fmt, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check .

      - name: Lint
        run: deno lint .

      - name: Test
        run: deno test --allow-env .
